  <!-- Patrón decorativo de 10 sellos -->
  <g fill="none" stroke="white" stroke-width="3" stroke-opacity="0.5">
    <circle cx="150" cy="240" r="25" />
    <circle cx="230" cy="240" r="25" />
    <circle cx="310" cy="240" r="25" />
    <circle cx="390" cy="240" r="25" />
    <circle cx="470" cy="240" r="25" />
    <circle cx="550" cy="240" r="25" />
    <circle cx="630" cy="240" r="25" />
    <circle cx="710" cy="240" r="25" />
    <circle cx="790" cy="240" r="25" />
    <circle cx="870" cy="240" r="25" />
  </g>

  <!-- Tipografía BunnyCure -->
  <text x="50%" y="140" font-family="Segoe UI, Roboto, Arial" font-size="64" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">
    BunnyCure
  </text>

  <!-- Subtexto descriptivo -->
  <text x="50%" y="185" font-family="Segoe UI, Roboto, Arial" font-size="20" fill="white" fill-opacity="0.8" text-anchor="middle" letter-spacing="1">
    PROGRAMA DE FIDELIZACIÓN
  </text>
